<svg xmlns="http://w3.org" viewBox="0 0 850 360" width="100%" height="100%" style="background: transparent;">
  <defs>
    <!-- 赛博朋克高级霓虹发光滤镜 -->
    <filter id="neon-glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="neon-glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* 基础字体设置：采用极具硬核科技感的等宽字体 */
    .cyber-text {
      font-family: 'Courier New', Courier, Fira Code, monospace;
      font-weight: bold;
      fill: #ffffff;
      opacity: 0;
    }

    /* 赛博朋克高端配色体系 */
    .cyan-neon { fill: #00f2fe; filter: url(#neon-glow-blue); }
    .pink-neon { fill: #ff007f; filter: url(#neon-glow-pink); }
    .yellow-neon { fill: #ffe600; }
    .gray-dim { fill: #8a99ad; font-weight: normal; }
    .icon-prefix { font-family: monospace; font-weight: 900; }

    /* 终端控制台流式动效 */
    .line-1 {
      animation: fadeInGlitch 0.6s ease-out forwards;
      animation-delay: 0.1s;
    }

    .line-2 {
      animation: fadeInGlitch 0.6s ease-out forwards;
      animation-delay: 0.9s;
    }

    /* 第三行正义宣言的分段加载，营造戏剧张力 */
    .line-3-p1 { animation: textReveal 0.8s ease-out forwards; animation-delay: 1.8s; }
    .line-3-p2 { animation: textReveal 0.8s ease-out forwards; animation-delay: 2.6s; }
    .line-3-p3 { animation: textReveal 0.8s ease-out forwards; animation-delay: 3.4s; }

    /* 核心品牌词 WFSpeed.run 强烈的霓虹故障闪烁 */
    .brand-wf {
      font-size: 24px;
      animation: textReveal 0.3s ease-out forwards, glitchBlink 2.5s infinite alternate;
      animation-delay: 3.4s;
    }

    /* 科技感边框与点缀动画 */
    .deco-line {
      stroke: #ff007f;
      stroke-width: 1.5;
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: drawLine 2s ease-out forwards;
      filter: url(#neon-glow-pink);
    }
    .deco-dot {
      fill: #00f2fe;
      animation: pulse 0.8s infinite alternate;
    }

    /* CSS 动画库 */
    @keyframes fadeInGlitch {
      0% { opacity: 0; transform: translateX(-15px); filter: hue-rotate(90deg); }
      10% { opacity: 0.7; transform: translateX(4px); }
      20% { opacity: 0.2; }
      30% { opacity: 1; transform: translateX(0); }
      100% { opacity: 1; }
    }

    @keyframes textReveal {
      to { opacity: 1; }
    }

    @keyframes glitchBlink {
      0%, 100% { fill: #ff007f; filter: drop-shadow(0 0 8px #ff007f); text-shadow: 2px 2px #00f2fe; }
      40% { fill: #ffe600; filter: drop-shadow(0 0 2px #ffe600); text-shadow: -2px -2px #ff007f; }
      45% { fill: #00f2fe; filter: drop-shadow(0 0 12px #00f2fe); }
      46% { opacity: 0.2; }
      48% { opacity: 1; }
    }

    @keyframes drawLine {
      to { stroke-dashoffset: 0; }
    }

    @keyframes pulse {
      0% { opacity: 0.2; }
      100% { opacity: 1; }
    }
  </style>

  <!-- 外层精细的军用控制台边框 -->
  <path d="M 20 10 L 830 10 L 840 20 L 840 340 L 830 350 L 20 350 L 10 340 L 10 20 Z" fill="none" stroke="#00f2fe" stroke-width="1" opacity="0.2"/>
  
  <!-- 左上角黑客终端准星组件 (取代原本低级的点) -->
  <path d="M 12 15 L 22 15 M 17 10 L 17 20" stroke="#00f2fe" stroke-width="1.5" opacity="0.8" />
  <rect x="14" y="12" width="6" height="6" fill="none" stroke="#ff007f" stroke-width="1" class="deco-dot" />
  
  <text x="715" y="25" class="cyber-text line-1 gray-dim" font-size="11" letter-spacing="1">CONSOLE // AUTH_OK</text>

  <!-- 第一行：个人核心身份 -->
  <text x="35" y="70" class="cyber-text line-1" font-size="25">
    I'm <tspan class="pink-neon">Roc</tspan>, a <tspan class="cyan-neon">Hybrid Independent Management Consultant</tspan>.
  </text>

  <!-- 第二行：社区身份（移除火箭，改用高亮科技指针 ▶） -->
  <text x="35" y="120" class="cyber-text line-2" font-size="18">
    <tspan class="pink-neon icon-prefix">▶ </tspan><tspan class="yellow-neon">Online gaming enthusiast</tspan>, currently a member of the 
    <tspan class="cyan-neon">Warframe Mainland China</tspan> community management team.
  </text>

  <!-- 霓虹冷光分割线 -->
  <line x1="35" y1="150" x2="815" y2="150" fill="none" class="deco-line" />

  <!-- 第三行：正义宣言与项目介绍（移除雷电，改用硬核黑客命令提示符 $） -->
  <g font-size="15" class="cyber-text">
    <!-- 原因段落 -->
    <text x="35" y="195" class="line-3-p1 gray-dim">
      To counter the long-standing <tspan fill="#ff3333" font-weight="bold">malicious bias and harassment</tspan> against Chinese players on speedrun.com,
    </text>
    <text x="35" y="225" class="line-3-p2 gray-dim">
      as well as the platform's politically wrongful stances supporting <tspan fill="#ff3333">Taiwan and Hong Kong independence</tspan>,
    </text>
    
    <!-- 结果段落：命令输入提示符风格 -->
    <text x="35" y="275" class="line-3-p3">
      <tspan class="cyan-neon icon-prefix">$ </tspan>I founded <tspan class="brand-wf">WFSpeed.run</tspan> — a dedicated leaderboard platform
    </text>
    <text x="55" y="305" class="line-3-p3 cyan-neon" font-size="14" fill-opacity="0.75">
      &gt;_ enhanced with a wide range of practical, built-in features.
    </text>
  </g>

  <!-- 右下角模块状态块 -->
  <rect x="795" y="332" width="20" height="8" fill="#ffe600" opacity="0.6" />
  <rect x="820" y="332" width="5" height="8" fill="#00f2fe" opacity="0.8" />
</svg>
